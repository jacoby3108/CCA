<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azotea Group Document Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
        }
        h1 {
            color: #24292e;
            border-bottom: 2px solid #eaecef;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f6f8fa;
            color: #24292e;
        }
        tr:hover {
            background-color: #f1f3f5;
        }
        .btn {
            display: inline-block;
            padding: 6px 12px;
            background-color: #2ea44f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn:hover {
            background-color: #2c974b;
        }
    </style>
</head>
<body>

    <h1>Azotea Group - Document Archive</h1>
    <p>Click on any document below to view or download it.</p>

    <table>
        <thead>
            <tr>
                <th>Index</th>
                <th>Document Title</th>
                <th>Date Added</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            
            <tr>
                <td>1</td>
                <td><strong>Project Proposal Presentation</strong> (.pptx)</td>
                <td>2026-05-30</td>
                <td><a href="documents/proposal.pptx" class="btn" download>Download</a></td>
            </tr>

            <tr>
                <td>2</td>
                <td><strong>Financial Quarterly Report</strong> (.pdf)</td>
                <td>2026-05-28</td>
                <td><a href="documents/report.pdf" class="btn" target="_blank">View PDF</a></td>
            </tr>

            </tbody>
    </table>

</body>
</html>
